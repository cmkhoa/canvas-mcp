[package]
name = "canvas-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.3"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
wiremock = "0.6.5"
