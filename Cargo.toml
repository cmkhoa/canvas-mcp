[package]
name = "canvas-mcp"
version = "0.1.0"
edition = "2024"
description = "Canvas LMS MCP server in Rust: read your deadlines, grades and course content"
repository = "https://github.com/cmkhoa/canvas-mcp"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["mcp", "canvas", "lms", "education"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
html2text = "0.17.4"
iana-time-zone = "0.1.65"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.3"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
rmcp = { version = "3.9.0", features = ["client", "transport-async-rw"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt-multi-thread"] }
wiremock = "0.6.5"
